name: Build FMLY CRAFT APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.fmlycraft --project-name fmly_craft .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (demo mode)
        run: flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fmly-craft-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
