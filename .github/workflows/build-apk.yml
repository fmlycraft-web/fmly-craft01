name: Build FMLY CRAFT APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.fmlycraft --project-name fmly_craft .

      - name: Configure compileSdk and Gradle properties
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          cat << 'GRADLE' >> android/build.gradle
          subprojects {
              project.configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'com.android.support.test.espresso') {
                          details.useVersion '3.0.2'
                      }
                  }
              }
              plugins.withId('com.android.library') {
                  project.android {
                      compileSdkVersion 34
                      defaultConfig {
                          targetSdkVersion 34
                      }
                  }
              }
          }
          GRADLE

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (demo mode)
        run: flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fmly-craft-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
